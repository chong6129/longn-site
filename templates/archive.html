{% extends "base.html" %}

{% block title %}Archive | longn.ca{% endblock %}

{% block content %}

<section class="posts">
    <h1>Archive</h1>

    <div class="archive-list">
        {% for post in posts %}
        <div class="archive-item">
            <span class="archive-date">{{ post.date }}</span>

            <a href="{{ url_for('post', slug=post.slug) }}">
                {{ post.title }}
            </a>
        </div>
        {% endfor %}
    </div>
</section>

{% endblock %}

{% extends "base.html" %}

{% block title %}Blog | longn.ca{% endblock %}

{% block content %}

<section class="posts">
    <h1>Blog</h1>

    {% for post in posts %}
        <article>
            <h2>
                <a href="{{ url_for('post', slug=post.slug) }}">
                    {{ post.title }}
                </a>
            </h2>
        </article>
    {% endfor %}
</section>

{% endblock %}

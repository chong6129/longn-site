{% extends "base.html" %}

{% block title %}Blog | longn.ca{% endblock %}

{% block content %}

<section class="posts">
    <h1>Blog</h1>

   {% for post in posts %}
    <article class="blog-post-preview">
        <h2>
            <a href="{{ url_for('post', slug=post.slug) }}">
                {{ post.title }}
            </a>
        </h2>

        <p class="post-date">{{ post.date }}</p>

        <p>{{ post.description }}</p>
    </article>
{% endfor %}
</section>

{% endblock %}
